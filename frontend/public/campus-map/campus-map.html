<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UOS Campus Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen 3D campus (the Blender model), search panel top-left, room/building card below it,
   level switcher on the right edge, category filters bottom-left, camera tools bottom-right. */
/* Mosaed's design language (the chatbot this map lives in): Inter, black and white for about 80% of the UI,
   the University of Sharjah green #60B68F for the rest, and floating glass panels over the map.
   --accent is the green itself (fills, with black text on top); --accent-ink is a deeper shade for green text and
   thin icons so they stay readable on white; --ink is black (white in dark mode) for primary buttons and the
   selected level. */
:root{
  --bg:#f1f2f1; --scene:#e8ebe9; --fade:#eceeec; --fade-edge:#d4d8d5; --surface:#ffffff; --surface-2:rgba(0,0,0,.05);
  --fg:#000000; --fg-2:#3a3a3a; --muted:#767676; --line:rgba(0,0,0,.08); --ink:#000000; --ink-fg:#ffffff;
  --accent:#60b68f; --accent-fg:#000000; --accent-ink:#2f7f5b; --accent-soft:rgba(96,182,143,.16);
  /* glass panels, the same as the chatbot's sidebar */
  --glass:rgba(255,255,255,.85); --glass-border:rgba(255,255,255,.9); --glass-blur:blur(22px) saturate(170%);
  --shadow:0 0 0 1px rgba(0,0,0,.05),0 18px 50px -16px rgba(0,0,0,.18);
  --shadow-sm:0 0 0 1px rgba(0,0,0,.05),0 4px 14px -6px rgba(0,0,0,.16);
  --r:20px; --ease-out:cubic-bezier(.23,1,.32,1);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:var(--f-ui);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --scene:#0f1110; --fade:#1d201e; --fade-edge:#2b2f2d; --surface:#0d0d0d; --surface-2:rgba(255,255,255,.06);
  --fg:#ffffff; --fg-2:#d0d0d0; --muted:#8a8a8a; --line:rgba(255,255,255,.09); --ink:#ffffff; --ink-fg:#000000;
  --accent:#60b68f; --accent-fg:#000000; --accent-ink:#60b68f; --accent-soft:rgba(96,182,143,.16);
  --glass:rgba(22,22,22,.85); --glass-border:rgba(255,255,255,.1); --glass-blur:blur(22px) saturate(150%);
  --shadow:0 0 0 1px rgba(255,255,255,.06),0 20px 60px -16px rgba(0,0,0,.9);
  --shadow-sm:0 0 0 1px rgba(255,255,255,.06),0 6px 18px -6px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --scene:#0f1110; --fade:#1d201e; --fade-edge:#2b2f2d; --surface:#0d0d0d; --surface-2:rgba(255,255,255,.06);
  --fg:#ffffff; --fg-2:#d0d0d0; --muted:#8a8a8a; --line:rgba(255,255,255,.09); --ink:#ffffff; --ink-fg:#000000;
  --accent:#60b68f; --accent-fg:#000000; --accent-ink:#60b68f; --accent-soft:rgba(96,182,143,.16);
  --glass:rgba(22,22,22,.85); --glass-border:rgba(255,255,255,.1); --glass-blur:blur(22px) saturate(150%);
  --shadow:0 0 0 1px rgba(255,255,255,.06),0 20px 60px -16px rgba(0,0,0,.9);
  --shadow-sm:0 0 0 1px rgba(255,255,255,.06),0 6px 18px -6px rgba(0,0,0,.7); color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#app{position:fixed;inset:0;-webkit-tap-highlight-color:transparent}
#gl,#labels{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}   /* long-press on the map: no text selection or iOS callout */
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* floating glass panels; the border is the glass edge, and becomes a real outline in Windows high-contrast (forced colours) */
.card{background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--r);box-shadow:var(--shadow)}
button,input{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}
/* times, levels and counts line up in columns */
.tm,.wd>b,.res .lv,.grid .tc,.sum b,.fchip em{font-variant-numeric:tabular-nums}

/* loading */
#load{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;transition:opacity .4s}
#load.done{opacity:0;pointer-events:none}
#load .box{width:min(280px,calc(100% - 48px));display:grid;gap:12px;text-align:center}
#load b{font-size:15px;font-weight:600}
#load span{font-size:12.5px;color:var(--muted)}
#bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
/* inside the chatbot the sidebar already carries the brand, so the map drops its own mark */
.embedded .mark{display:none}
.embedded .bar{padding-left:10px}

/* left column */
#side{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));bottom:max(60px,env(safe-area-inset-bottom,0px));
  width:min(320px,calc(100% - 24px));display:flex;flex-direction:column;gap:8px;pointer-events:none;min-height:0}
#side>*{pointer-events:auto}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#panel{display:flex;flex-direction:column;min-height:0;flex:0 1 auto;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:8px}
.mark{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font-weight:700;font-size:10px;flex:none;position:relative;overflow:hidden;padding-bottom:3px;box-sizing:border-box}
.mark::after{content:"";position:absolute;left:4px;right:4px;bottom:4px;height:3px;border-radius:50% 50% 0 0/100% 100% 0 0;background:var(--accent)}   /* the logo's green arc */
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 6px;color:var(--muted);border-radius:12px}   /* 12 + the bar's 8px padding = the card's 20px: concentric corners */
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:400 14px var(--f-ui);padding:8px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{filter:grayscale(1)}
.ib{width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
@media (hover:hover){.ib:hover{background:var(--surface-2);color:var(--fg)}}
/* Directions: the map's own route mark (green start A, black end B, the walk between them), not a generic arrow tile */
.vsep{width:1px;height:20px;background:var(--line);flex:none}
.ib.route{width:36px;height:34px;color:var(--fg-2)}
.ib.route .rp{stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-dasharray:.1 3;transition:stroke-dashoffset .5s var(--ease-out)}
.ib.route .ra{fill:var(--route)}
.ib.route .rb{fill:var(--route-b)}
@media (hover:hover){.ib.route:hover{color:var(--fg)}.ib.route:hover .rp{stroke-dashoffset:-6.6}}   /* the dots walk along the path on hover */
.ib.route[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.crumbs{display:flex;align-items:center;gap:6px;padding:0 14px 10px;font-size:12px;color:var(--muted);flex-wrap:wrap;line-height:1.3}
.crumbs button{all:unset;cursor:pointer;color:var(--accent-ink);font-weight:500}
@media (hover:hover){.crumbs button:hover{text-decoration:underline;text-underline-offset:3px}}
.crumbs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.crumbs span:last-child{color:var(--fg);font-weight:600}
#results{overflow:auto;border-top:1px solid var(--line);min-height:0;max-height:46vh;padding:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.res{display:flex;gap:10px;align-items:center;padding:8px 10px;cursor:pointer;border:0;border-radius:12px;background:transparent;width:100%;text-align:left;font:inherit;color:inherit}
.res:focus-visible{background:var(--surface-2);outline:none}
@media (hover:hover){.res:hover{background:var(--surface-2)}}
.res>span{min-width:0}
.res .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .s{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .lv{margin-left:auto;font:500 11px var(--f-ui);color:var(--muted);flex:none}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
/* info card: title, one muted subtitle line, one main action, then plain sections */
#info{padding:16px 16px 18px;display:grid;gap:14px;overflow:auto;min-height:0;flex:0 1 auto;position:relative;align-content:start;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#info>*{min-width:0}
.ihead{display:flex;gap:8px;align-items:flex-start}
.itx{flex:1;min-width:0;display:grid;gap:4px}
#info h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.ibtns{display:flex;gap:2px;flex:none;margin:-4px -6px 0 0}
.sub{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--muted)}
.sub .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
#info p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.sec{display:grid;gap:8px;min-width:0}
.sec h3{margin:0;font-size:13px;font-weight:600;color:var(--fg)}
.sec h3 span{font-weight:500;color:var(--muted);font-size:12px}
.who{display:grid;gap:2px;padding-top:14px;border-top:1px solid var(--line)}
.who b{font-size:14px;font-weight:600}
.who span{font-size:12px;color:var(--muted)}
.ct{display:flex;align-items:baseline;gap:8px;font-size:12.5px;min-width:0}
.ct a{color:var(--fg);font-weight:500;text-decoration:none;overflow-wrap:anywhere;min-width:0}
@media (hover:hover){.ct a:hover{text-decoration:underline;text-underline-offset:3px}}
.copy{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--accent-ink);flex:none}
@media (hover:hover){.copy:hover{text-decoration:underline;text-underline-offset:3px}}
.wk{display:grid;gap:6px}
.wd{display:grid;grid-template-columns:32px 1fr;gap:8px;font-size:12px;align-items:start}
.wd>b{font:600 11.5px var(--f-ui);color:var(--muted);padding-top:1px}
.ws{display:grid;gap:4px;min-width:0}
.wi{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline;min-width:0;padding:2px 8px;border-radius:7px;background:var(--surface-2)}
.wi.office{background:var(--accent-soft)}
.wi.class{background:rgba(91,143,214,.14)}
.tm{font:500 11.5px var(--f-ui);color:var(--fg)}
.wt{color:var(--muted);overflow-wrap:anywhere;min-width:0}
.free{font-size:12px;color:var(--muted);margin:0}
/* weekly schedule button in the card */
.sbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);color:var(--fg);font-size:13px;font-weight:600}
@media (hover:hover){.sbtn:hover{background:var(--surface-2)}}
.sbtn>svg:first-child{color:var(--accent-ink);flex:none}
.sbtn span{flex:1;display:grid;gap:1px}
.sbtn small{font-size:11.5px;font-weight:500;color:var(--muted)}
.sbtn .chev{color:var(--muted);flex:none}
/* weekly schedule dialog: a clear day × time grid over the map */
#sched{padding:0;margin:auto;width:min(880px,calc(100% - 24px));max-width:none;max-height:calc(100% - 48px);color:var(--fg);background:var(--surface);overflow:hidden}   /* solid: the timetable's sticky headers sit on it */
#sched[open]{display:flex;flex-direction:column}
#sched::backdrop{background:rgba(10,14,12,.38)}
.shead{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.shead h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);align-self:center;margin-left:auto}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.lg{width:10px;height:10px;border-radius:3px;background:rgba(91,143,214,.45)}
.lg.office{background:var(--accent)}
.sbody{overflow:auto;min-height:0}
.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:600px;table-layout:fixed;font-size:12.5px}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.grid tr>:last-child{border-right:0}
.grid tbody tr:last-child>*{border-bottom:0}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:600;font-size:12.5px;padding:10px 8px}
.grid thead th span{font-size:11px;font-weight:600;color:var(--accent-ink);margin-left:4px}
.grid .tc{width:104px;position:sticky;left:0;z-index:1;background:var(--surface);font:500 11.5px var(--f-ui);color:var(--muted);padding:8px}
.grid thead .tc{z-index:3;font:600 12.5px var(--f-ui);color:var(--muted)}
.grid td.today{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.blk{border-radius:8px;padding:6px 8px;background:rgba(91,143,214,.14);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.blk small{display:block;margin-top:2px;font-weight:500;color:var(--muted);font-size:11px}
.blk.office{background:color-mix(in srgb,var(--accent) 26%,var(--surface))}
.blk+.blk{margin-top:4px}
/* buttons: the chatbot's black pill for the main action, a quiet outlined pill beside it */
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--ink);color:var(--ink-fg);font-weight:600;font-size:13px;height:36px;padding:0 16px;border-radius:999px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.list{display:grid;gap:2px}
.list button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:500;padding:6px 8px;border-radius:8px}
@media (hover:hover){.list button:hover{background:var(--surface-2)}}

/* levels, tools, filters: small floating glass pills */
#levels{position:absolute;z-index:5;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:4px;align-items:center;border-radius:14px}
#levels .cap{display:none}
.lvbtn{width:34px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--fg-2);font:600 13px var(--f-ui);cursor:pointer}
@media (hover:hover){.lvbtn:hover{background:var(--surface-2);color:var(--fg)}}
.lvbtn[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.lvbtn.all{font-size:11px}
#tools{position:absolute;z-index:5;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:4px;border-radius:14px}
#tools button{width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--fg-2);cursor:pointer;display:grid;place-items:center;padding:0}
@media (hover:hover){#tools button:hover{background:var(--surface-2);color:var(--fg)}}
#filters{position:absolute;z-index:5;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px;max-width:calc(100% - 200px)}
#filters::-webkit-scrollbar{display:none}
.fchip{display:flex;align-items:center;gap:6px;border:1px solid var(--glass-border);background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);color:var(--fg);border-radius:999px;height:30px;padding:0 12px 0 10px;font:500 12px var(--f-ui);cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-sm);flex:none}
.fchip .dot{width:8px;height:8px;border-radius:50%}
.fchip[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent-ink);font-weight:600}
.fchip em{font-style:normal;color:var(--muted);font-weight:500}
.fchip[aria-pressed="true"] em{color:inherit}
/* surroundings from OpenStreetMap */
:root{--road:#ffffff;--road-edge:#d5dad5;--osm-bld:#dde1dc;--park:#d4e7cd;--pitch:#c6e0bd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--road:#2b322e;--road-edge:#1f2522;--osm-bld:#252b28;--park:#1e3125;--pitch:#213a28}}
:root[data-theme="dark"]{--road:#2b322e;--road-edge:#1f2522;--osm-bld:#252b28;--park:#1e3125;--pitch:#213a28}
.lbl.st{background:none;border:0;box-shadow:none;padding:0;font:700 10px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);pointer-events:none;
  text-shadow:0 0 3px var(--scene),0 0 3px var(--scene),0 0 2px var(--scene),0 0 1px var(--scene)}
.lbl.st.major{font-size:11px;color:color-mix(in srgb,var(--fg) 70%,var(--muted))}
.lbl.poi{font-size:10.5px;font-weight:600;padding:2px 7px 2px 5px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--surface) 85%,transparent)}
.lbl.poi i{width:8px;height:8px}
#osmcredit{position:absolute;z-index:5;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 46px);font-size:10px;color:var(--muted);text-decoration:none;
  background:color-mix(in srgb,var(--surface) 80%,transparent);padding:2px 6px;border-radius:6px}
@media (hover:hover){#osmcredit:hover{color:var(--fg);text-decoration:underline}}
/* toast: the chatbot's black pill (white in dark mode) */
#toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);padding:9px 16px;font-size:12.5px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:8;max-width:calc(100% - 32px);text-align:center;
  background:var(--ink);color:var(--ink-fg);border:0;border-radius:999px;-webkit-backdrop-filter:none;backdrop-filter:none}
#toast.on{opacity:1}

/* map labels */
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:600;color:var(--fg);
  background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);padding:2px 8px;border-radius:999px;
  pointer-events:auto;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;align-items:center;gap:5px;will-change:translate}
.lbl i{width:7px;height:7px;border-radius:50%;flex:none}
.lbl.bld{font-size:12px;font-weight:700;padding:3px 10px;gap:6px}
.lbl.bld small{font-weight:500;font-size:10.5px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis}
.lbl.bld.has{border-color:var(--accent);border-width:1.5px}   /* green outline = has floor plans */
.lbl.lvl{font-size:11.5px;font-weight:600;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.lbl.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);z-index:3}
/* hover look for an ordinary room label; a selected room keeps its green label (its dark text would vanish on the dark-mode surface) */
.lbl.hov:not(.sel){border-color:var(--accent);background:var(--surface);color:var(--fg)}
.lbl.hov{z-index:4;transform:translate(-50%,-50%) scale(1.1);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.lbl.sel i{background:var(--accent-fg)!important}
.lbl.pending{color:var(--muted);font-weight:500;pointer-events:none;cursor:default}   /* unknown rooms: label only, not a button */
.lbl.off{display:none}

/* directions */
/* route = the logo green (a touch deeper in light mode so the line and white text on the A pin stay readable on pale floors);
   start A = green, destination B = the logo black (white in dark mode) */
:root{--route:#2e8a61;--route-fg:#ffffff;--route-b:var(--ink);--route-b-fg:var(--ink-fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--route:#61b68f;--route-fg:#0d1f16}}
:root[data-theme="dark"]{--route:#61b68f;--route-fg:#0d1f16}
#dir{padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0;flex:0 1 auto;overflow:hidden;position:relative}
#dir .dhead{display:flex;align-items:center;gap:8px}
#dir .dhead b{font-size:15px;font-weight:650;flex:1}
.ends{display:grid;grid-template-columns:1fr 34px;gap:6px 6px;align-items:center}
.end{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:0 6px 0 10px;grid-column:1;transition:border-color .15s ease,background-color .15s ease}
.end:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:var(--surface)}
.end input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:500 13px var(--f-ui);padding:9px 0;outline:none}
.end input::placeholder{color:var(--muted);font-weight:400}
.end .clr{all:unset;cursor:pointer;color:var(--muted);font-size:15px;padding:0 4px;border-radius:6px}
@media (hover:hover){.end .clr:hover{color:var(--fg)}}
.pin{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--f-ui);font-style:normal;color:#fff;flex:none}
.pin.a{background:var(--route);color:var(--route-fg)} .pin.b{background:var(--route-b);color:var(--route-b-fg)}
.swap{grid-column:2;grid-row:1/3;width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--fg-2);font:600 16px var(--f-ui);cursor:pointer}
.sug{border:1px solid var(--line);border-radius:12px;max-height:34vh;overflow:auto;margin-top:-4px;padding:4px;background:var(--surface)}
.sf{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--fg-2);cursor:pointer;user-select:none}
.sf input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.sum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sum b{font-size:20px;font-weight:650;letter-spacing:-.01em}
.sum span{font-size:12.5px;color:var(--muted)}
.sum.err{color:var(--muted);font-size:12.5px;line-height:1.45}
.steps{list-style:none;margin:0 -4px;padding:0;display:grid;gap:2px;overflow:auto;min-height:0;flex:0 1 auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.steps button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;width:100%;padding:8px;border-radius:12px;font-size:12.5px;line-height:1.4}
@media (hover:hover){.steps button:hover{background:var(--surface-2)}}
.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.steps button[aria-current="step"]{background:var(--accent-soft)}
.steps .ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font:700 11px var(--f-ui);color:var(--muted)}
.steps .ic.go{background:var(--route);color:var(--route-fg)}
.steps .ic.fin{background:var(--route-b);color:var(--route-b-fg)}
.steps small{display:block;color:var(--muted);font-size:11.5px}
.dnav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.dnav .btn{height:34px;padding:0 8px;font-size:12.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.acts{display:flex;gap:6px}
.acts .btn:first-child{flex:1}
.lbl.rpin{font-weight:700;color:#fff;border-color:transparent;z-index:4;gap:6px}
.lbl.rpin.a{background:var(--route);color:var(--route-fg)} .lbl.rpin.b{background:var(--route-b);color:var(--route-b-fg)}
.lbl.rpin.transfer{background:var(--surface);color:var(--fg);border-color:var(--route);pointer-events:none}
.lbl.rpin em{font-style:normal;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:10px}

@media (max-width:760px){
  #side{bottom:calc(max(12px,env(safe-area-inset-bottom,0px)) + 52px);max-height:none}
  #dir{position:static;flex:0 1 35%;max-height:none;overflow:auto}
  #dir .steps{max-height:22vh}
  #dir.compact .ends,#dir.compact .sf,#dir.compact #dsug{display:none}
  #dir.compact{flex-basis:25%}
  #results{max-height:34vh}
  .search input,.end input{font-size:16px}   /* iPhone zooms the page into any text field under 16px */
  #info{position:relative;flex:0 1 auto;max-height:none}
  #sched{width:calc(100% - 16px);max-height:calc(100% - 32px)}
  .legend{display:none}
  .grid{min-width:520px;font-size:12px}
  .grid .tc{width:84px}
  #filters{display:none}
  #levels{top:auto;bottom:max(12px,env(safe-area-inset-bottom,0px));right:auto;left:max(12px,env(safe-area-inset-left,0px));transform:none;flex-direction:row}
  #tools{flex-direction:row}
  #tools #zin,#tools #zout{display:none}
}
/* ---- interaction polish ---- */
/* scroll areas inside panels and the dialog don't pass their scroll on to the map/page behind */
#results,#info,#dir,.steps,.sug,.sbody{overscroll-behavior:contain}
/* hover and press: colour changes are quick (120ms) and named explicitly, never "all" */
.ib,.btn,.sbtn,.lvbtn,#tools button,.fchip,.swap,.res,.list button,.steps button,.copy,.crumbs button{
  transition:background-color .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .16s var(--ease-out)}
/* press feedback: a small squeeze so taps feel registered (disabled buttons already ignore the pointer) */
.ib:active,.btn:active,.sbtn:active,.lvbtn:active,#tools button:active,.fchip:active,.swap:active{transform:scale(.97)}
.ib,.btn,.sbtn,.lvbtn,#tools button,.fchip,.swap{-webkit-tap-highlight-color:transparent}
@media (hover:hover){
  .btn:hover{background:color-mix(in srgb,var(--ink) 82%,var(--ink-fg))}
  .btn.ghost:hover{background:var(--surface-2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 16%,transparent)}
  .swap:hover{background:var(--surface-2);color:var(--fg)}
  .fchip:hover{border-color:color-mix(in srgb,var(--fg) 14%,transparent)}
}
/* the weekly schedule opens with a short fade-and-rise (a one-time entrance, so a keyframe) */
#sched[open]{animation:pop .2s var(--ease-out)}
#sched[open]::backdrop{animation:fade .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes fade{from{opacity:0}}
/* toast rises a few pixels as it fades in */
#toast{transition:opacity .2s ease,translate .2s ease;translate:0 4px}
#toast.on{translate:0 0}
@media (prefers-reduced-motion:reduce){
  #load,#bar i{transition:none}
  #toast{transition:opacity .2s ease;translate:none}
  .ib,.btn,.sbtn,.lvbtn,#tools button,.fchip,.swap{transition:background-color .12s ease,color .12s ease,border-color .12s ease}
  .ib:active,.btn:active,.sbtn:active,.lvbtn:active,#tools button:active,.fchip:active,.swap:active{transform:none}
  #sched[open]{animation:fade .15s ease}
  .lbl.hov{transform:translate(-50%,-50%)}
}
@media (forced-colors:active){.lbl,.fchip,.card{border-color:CanvasText}}

    if (e.key !== "Escape" || e.defaultPrevented || document.querySelector("dialog[open]")) return;

    if (shown("results")){ const q = document.getElementById("q"); q.value = ""; q.dispatchEvent(new Event("input")); return; }
    if (shown("dsug")) return;                                    // the directions field closes its own suggestions
    if (shown("dir")){ document.getElementById("dirx").click(); return; }

// photographed office directories (A9, A11): mapping[meshId] gives the real room number, the directory gives its occupants and timetables
function applyDirectory(bid, DIRECTORY, mapping, levels){
  if (!DIRECTORY || !mapping) return;
  const categories = {
    "Office":"office", "Office Suite":"office", "Lab":"lab", "Classroom":"classroom",
    "Washroom":"washroom", "Prayer Room":"prayer", "Pantry":"service",
    "Mail Room":"service", "Conference Room":"service",
  };
  for (const r of ROOMS){
    if (r.b !== bid || !levels.includes(r.lv) ||
        ["stairs", "elevator", "circulation"].includes(r.cat)) continue;
    // Mesh IDs are provisional. Only an explicit room-position match is valid.
    const match = mapping[r.id];
    if (!match) continue;
    const number = typeof match === "string" ? match : match.number;
    if (!number){
      r.name = match.name;
      r.directoryInfo = {number:null};
      if (r.name.startsWith("NOT MAPPED")) r.cat = "pending";
      continue;
    }
    const entry = DIRECTORY.rooms[number];
    if (!entry || entry.level !== r.lv || entry.roomNumberConflict){
      console.warn(bid + " directory match needs review", r.id, number);
      continue;
    }
    const inside = (match.inside || []).map(id => DIRECTORY.rooms[id]).filter(Boolean);
    const people = entry.people || [];
    const occupants = [...people, ...inside.flatMap(room => room.people || [])];
    r.directoryInfo = {
      number, people, inside,
      instructor:occupants.map(p => p.name).filter(Boolean).join(" / "),
      email:occupants.map(p => p.email).filter(Boolean).join(" "),
      department:[...new Set(occupants.map(p => p.department).filter(Boolean))].join(" / "),
    };
    r.name = match.name || entry.roomName || number;
    if (categories[entry.roomType]) r.cat = categories[entry.roomType];
  }
}

function directoryDetails(people){
  return people.map(person => {
    const schedule = person.schedule;
    let html = personBlock(person.name || "Office occupant", [person.role, person.department], person.email, nineDigitPhone(person.phone));
    if (!schedule) return html + '<p class="free">No timetable posted.</p>';
    const period = [schedule.term, schedule.academicYear].filter(Boolean).join(" ");

      week(schedule.officeHours, "office", "None listed.") + '</div>';
    html += schedBtn(schedule.activities, person.name, period);

  L.forEach((l, i) => { const nx = L[i+1], pv = L[i-1];
    if (l.type === "walk" && !campusLeg(l)){
      const to = !nx ? R.Z.name : nx.type !== "walk" ? pName(nx) : nx.exit ? "the "+nodeName(nx.exit) : "the exit";
      out.push({ic:"→", t:`Walk ${metres(l.len)} to ${to}`, s:`${l.b} · ${lvName(l.b, l.lv)}`, leg:i}); }
    else if (l.type === "walk"){
      // where this stretch ends: a building door, the hallway / outdoor path that follows, or the destination
      const to = l.enter ? `the ${l.enter.b} ${nodeName(l.enter)}` : !nx ? R.Z.name
        : nx.where === "hall" ? "the covered hallway" : nx.where === "out" ? "the outdoor path" : nx.b ? nx.b : R.Z.name;
      if (l.where === "hall") out.push({ic:"⇢", t:(l.exit ? `Leave ${l.exit.b} by the ${nodeName(l.exit)} and walk` : "Walk")+` ${metres(l.len)} through the covered hallway to ${to}`, s:"Covered hallway", leg:i});
      else out.push({ic:"↗", t:(l.exit ? `Leave ${l.exit.b} by the ${nodeName(l.exit)} and walk` : "Walk")+` ${metres(l.len)} outside to ${to}`, s:"Outdoors", leg:i}); }
    else { const up = l.to > l.from, nm = pName(l);
      out.push({ic:l.type === "stairs" ? "⇅" : "▣", t:`Take ${nm} ${up ? "up" : "down"} to ${lvName(l.b, l.to)}`, s:`${l.b} · ${Math.abs(l.to - l.from)} floor${Math.abs(l.to - l.from) > 1 ? "s" : ""} ${up ? "up" : "down"}`, leg:i}); } });
  out.push({ic:"B", cls:"fin", t:`Arrive at ${R.Z.name}`, s:R.Z.where, leg:-2});
  return out; }

// ---------- drawing the route ----------
const routeMat = new THREE.MeshBasicMaterial({color:css("--route") || "#2e8a61", side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:-6, polygonOffsetUnits:-6});
routeMat.userData.tok = "--route"; fadeMats.push(routeMat);
const routeOutMat = new THREE.MeshBasicMaterial({color:css("--route") || "#2e8a61", side:THREE.DoubleSide, depthTest:false, transparent:true, opacity:.92});
routeOutMat.userData.tok = "--route"; fadeMats.push(routeOutMat);
const arrowMat = new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide, polygonOffset:true, polygonOffsetFactor:-8, polygonOffsetUnits:-8});
const arrowOutMat = new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide, depthTest:false, transparent:true});
let routeObjs = [], routePins = [], routeTransfers = [];
function ribbon(pts, y, w, gap, out){
  const P3 = pts.map(p => [p[0], -p[1]]), pos = [], ar = [], h = w/2;
  for (let k = 0; k < P3.length-1; k++){ const [x1, z1] = P3[k], [x2, z2] = P3[k+1], dx = x2-x1, dz = z2-z1, l = Math.hypot(dx, dz); if (l < 1e-6) continue;

  // moving arrows: one chevron shape (pointing +x) drawn many times; flowArrows() slides them forward every frame
  const cum = [0]; for (let k = 1; k < P3.length; k++) cum.push(cum[k-1] + Math.hypot(P3[k][0]-P3[k-1][0], P3[k][1]-P3[k-1][1]));

    ga.setAttribute("position", new THREE.Float32BufferAttribute([a,0,0, -.5*a,0,.8*a, -.15*a,0,0,  a,0,0, -.15*a,0,0, -.5*a,0,-.8*a], 3));

// ---------- animated arrows: every arrow moves forward along the route and re-enters at the start (a seamless loop) ----------
let flows = [];
const flowObj = new THREE.Object3D(), still = matchMedia("(prefers-reduced-motion: reduce)");
function flowArrows(now){

    const speed = f.gap*.55, phase = still.matches ? f.gap*.6 : (now/1000*speed) % f.gap;   // ~half a gap per second; reduced motion: arrows stay put
    let k = 0;
    for (let i = 0; i < f.n; i++){
      const s = phase + i*f.gap;
      if (s > f.total - .05){ flowObj.scale.setScalar(0); flowObj.updateMatrix(); f.mesh.setMatrixAt(i, flowObj.matrix); continue; }
      while (k < f.cum.length-2 && f.cum[k+1] < s) k++;      // arrows are in order along the path, so the segment index only moves forward
      const [x1, z1] = f.P3[k], [x2, z2] = f.P3[k+1], l = f.cum[k+1]-f.cum[k] || 1e-6, t = (s - f.cum[k])/l;

      flowObj.position.set(x1 + (x2-x1)*t, f.y, z1 + (z2-z1)*t); flowObj.rotation.set(0, Math.atan2(-uz, ux), 0); flowObj.scale.setScalar(Math.max(0, edge));

    f.mesh.instanceMatrix.needsUpdate = true; } }
function clearRouteDraw(){ routeObjs.forEach(o => { o.parent && o.parent.remove(o); o.traverse(x => x.geometry && x.geometry.dispose()); }); routeObjs = []; flows = [];
  routePins.forEach(p => p.el.remove()); routePins = [];
  routeTransfers.forEach(p => p.el.remove()); routeTransfers = [];
  const old = [...DIR.hi]; DIR.hi.clear(); new Set(old.map(r => r.B)).forEach(paint); }
function drawRoute(R){ clearRouteDraw(); if (!R || !R.legs) return;
  for (const l of R.legs){
    // hallway legs are drawn at roof height (the zigzag canopies peak at 4.9 m): at ground level a tilted camera shifts the line sideways
    // against the roof it is under, so it no longer looks centred in the hallway. Outdoor legs stay on the ground.
    if (campusLeg(l)){ const g = ribbon(l.pts, l.where === "hall" ? 4.7 : .35, l.where === "hall" ? 1.2 : 1.5, 7, true); scene.add(g); routeObjs.push(g); }
    else if (l.type === "walk"){ const b = bById[l.b]; buildSlices(b); const g = ribbon(l.pts, b.floors[l.lv] + .1, l.b === "A11" ? .30 : .55, 2.6, false); b.slices[l.lv].wrap.add(g); routeObjs.push(g); }
    else {
      const b = bById[l.b];
      buildSlices(b);
      const mode = l.type === "stairs" ? "Stairs" : "Elevator";
      const direction = l.to > l.from ? "↑" : "↓";
      for (const [lv, point, label] of [
        [l.from, l.at, mode+" "+direction+" to "+lvName(l.b, l.to)],
        [l.to, l.arrival, "From "+lvName(l.b, l.from)+" · "+mode],

  pin(R.A, "a", R.A.kind === "room" ? R.A.name : R.A.B.id); pin(R.Z, "b", R.Z.kind === "room" ? R.Z.name : R.Z.B.id);
  for (const ep of [R.A, R.Z]) if (ep.kind === "room"){ DIR.hi.add(ep.r); buildSlices(ep.r.B); paint(ep.r.B); }
}
const pinPos = new V3();
function routeFrame(){
  const inB = !!state.b; if (routeOutMat.depthTest !== inB){ routeOutMat.depthTest = arrowOutMat.depthTest = inB; routeOutMat.opacity = inB ? .55 : .92; routeOutMat.needsUpdate = arrowOutMat.needsUpdate = true; }
  for (const {b, lv, point, el} of routeTransfers){
    const wrap = b.slices[lv].wrap;
    const show = state.b === b && (state.level === "all" || state.level === lv) && wrap.visible;
    if (show) pinPos.set(point[0], b.floors[lv] + wrap.position.y + 1.5, -point[1]);
    place(el, pinPos, show, true);
  }
  for (const p of routePins){ const ep = p.ep; let show;
    if (ep.kind === "room"){ const b = ep.r.B; show = state.b === b && (state.level === "all" || state.level === ep.lv) && b.slices && b.slices[ep.lv].wrap.visible;
      if (show) pinPos.set(ep.c[0], b.floors[ep.lv] + b.slices[ep.lv].wrap.position.y + 2.2, -ep.c[1]);
      else { show = state.b !== b; pinPos.set(b.center.x, b.h + 9, b.center.z); } }
    else { const n = ep.selectedNode || ep.nodes[0]; show = true; pinPos.set(n.p[0], 4, -n.p[1]); }
    place(p.el, pinPos, show, true); }
}

// ---------- directions panel ----------
function openDir(){ if (!DIR.open){ DIR.open = true; $("dir").hidden = false; $("opendir").setAttribute("aria-pressed", "true"); if (state.sel){ clearSel(); } } ui(); }
function closeDir(){ DIR.open = false; $("opendir").setAttribute("aria-pressed", "false"); DIR.res = null; DIR.step = -1; DIR.from = DIR.to = null; $("dfrom").value = $("dto").value = ""; $("dsug").hidden = true; $("dir").hidden = true; clearRouteDraw(); ui(); }
const epLabel = id => { const r = byId[id]; if (r) return rName(r)+" · "+r.b+" "+lvName(r.b, r.lv); const b = bById[id]; return b ? b.id+" · "+(b.name||"").split(" / ")[0] : ""; };
function setEnd(which, id, quiet){ DIR[which] = id || null; $(which === "from" ? "dfrom" : "dto").value = id ? epLabel(id) : ""; $("dsug").hidden = true;
  DIR.field = !DIR.from ? "from" : !DIR.to ? "to" : DIR.field; if (!quiet) recompute(); }
function recompute(){ DIR.res = DIR.from && DIR.to ? plan(DIR.from, DIR.to, {stepFree:DIR.sf}) : null; DIR.step = -1; drawRoute(DIR.res && !DIR.res.fail ? DIR.res : null);
  if (DIR.res && !DIR.res.fail && !DIR.res.same) focusStep(-1); else ui(); }
function dirPick(id){ if (!DIR.open || (DIR.from && DIR.to) || !endpoint(id)) return false;
  setEnd(DIR.field === "to" || DIR.from ? "to" : "from", id); return true; }
function fmtTime(s){ const m = Math.max(1, Math.round(s/60)); return m < 60 ? m+" min" : Math.floor(m/60)+" h "+(m%60)+" min"; }
function renderDir(){ if (!DIR.open) return; const R = DIR.res, sum = $("dsum"), st = $("dsteps");
  $("dir").classList.toggle("compact", !!(R && !R.fail && !R.same && DIR.step >= 0));
  st.innerHTML = ""; $("dnav").hidden = true; sum.className = "sum";
  if (!DIR.from || !DIR.to){ sum.className = "sum err"; sum.textContent = !DIR.from && !DIR.to ? "Pick a start and a destination. Type a room number, an instructor or a building, or click one on the map."
      : !DIR.from ? "Now pick where you are starting from. Type it or click it on the map." : "Now pick your destination. Type it or click it on the map."; return; }
  if (!R){ sum.className = "sum err"; sum.textContent = "No walking route is mapped for this place yet."; return; }
  if (R.same){ sum.className = "sum err"; sum.textContent = "The start and destination are the same place."; return; }
  if (R.fail){ sum.className = "sum err"; sum.textContent = DIR.sf ? "No step-free route was found between these places." : "No route was found between these places."; return; }
  sum.innerHTML = `<b>${fmtTime(R.time)}</b><span>${metres(R.len)} walk${R.lift ? " · uses a lift" : ""}${R.stairs ? " · uses stairs" : ""}${R.sf ? " · step-free" : ""}</span>`;
  R.steps.forEach((s, i) => { const li = document.createElement("li"), b = document.createElement("button");
    b.innerHTML = `<i class="ic ${s.cls||""}">${esc(s.ic)}</i><span>${esc(s.t)}<small>${esc(s.s)}</small></span>`;
    if (i === DIR.step) b.setAttribute("aria-current", "step"); b.onclick = () => focusStep(i); li.append(b); st.append(li); });
  $("dnav").hidden = false; $("dprev").disabled = DIR.step <= 0; $("dnext").disabled = DIR.step >= R.steps.length-1;
  const cur = st.querySelector('[aria-current="step"]'); if (cur) cur.scrollIntoView({block:"nearest"}); }
// camera that shows every point of the route in the part of the screen the cards leave free
const fitCam = new THREE.PerspectiveCamera();
function fitView(pts, y){ let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity; for (const p of pts){ x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  const P3 = pts.map(p => new V3(p[0], p[2] ?? y, -p[1])), W = canvas.clientWidth, H = canvas.clientHeight, dir = new V3(0, 1.05, .7).normalize();
  const side = $("side").getBoundingClientRect(), mob = W <= 760, card = mob ? $("dir").getBoundingClientRect() : null;
  const L = mob ? -.9 : Math.min(.2, (side.right + 16)/W*2 - 1), R = .9, T = mob ? Math.min(.8, 1 - ($("panel").getBoundingClientRect().bottom + 12)/H*2) : .82, B = mob ? Math.max(-.6, 1 - (card.top - 10)/H*2) : -.85;
  fitCam.copy(camera); fitCam.aspect = W/Math.max(1, H);
  const c = new V3((x0+x1)/2, y, -(y0+y1)/2), v = new V3();
  const bounds = d => { fitCam.position.copy(c).addScaledVector(dir, d); fitCam.updateMatrixWorld(); fitCam.lookAt(c); fitCam.near = .5; fitCam.far = 1e5; fitCam.updateProjectionMatrix(); fitCam.updateMatrixWorld();
    let a = 9, b = -9, e = 9, f = -9; for (const q of P3){ v.copy(q).project(fitCam); a = Math.min(a, v.x); b = Math.max(b, v.x); e = Math.min(e, v.y); f = Math.max(f, v.y); } return [a, b, e, f]; };
  let d = Math.max(20, Math.max(x1-x0, y1-y0)*1.2);
  for (let it = 0; it < 4; it++){   // centre the route in the free area, then size it to fit
    let lo = 8, hi = 4000; for (let k = 0; k < 30; k++){ const m = (lo+hi)/2, [a, b, e, f] = bounds(m); if (b-a <= R-L && f-e <= T-B) hi = m; else lo = m; } d = Math.max(hi*1.06, 30);
    const [a, b, e, f] = bounds(d), ox = ((a+b)/2 - (L+R)/2), oy = ((e+f)/2 - (T+B)/2);
    const right = new V3().setFromMatrixColumn(fitCam.matrixWorld, 0), up = new V3().setFromMatrixColumn(fitCam.matrixWorld, 1);
    const halfW = Math.tan(fitCam.fov*Math.PI/360)*d*fitCam.aspect, halfH = Math.tan(fitCam.fov*Math.PI/360)*d;
    c.addScaledVector(right, ox*halfW).addScaledVector(up, oy*halfH); c.y = y; }
  return {p:c.clone().addScaledVector(dir, d), t:c}; }
function legView(l){ if (campusLeg(l)){ if (state.b) campusView(); return fitView(l.pts, 0); }
  const b = bById[l.b]; if (l.type !== "walk"){ if (state.b !== b) enterBuilding(b); else { state.level = "all"; } return viewBuilding(b, true); }
  if (state.b !== b) enterBuilding(b); state.level = l.lv; return fitView(l.pts, b.floors[l.lv] + l.lv*GAP); }
function focusStep(i){ const R = DIR.res; if (!R || !R.legs.length) return; DIR.step = i; clearSel(); $("dir").classList.toggle("compact", i >= 0);
  let v;
  if (i < 0 || i >= R.steps.length){ DIR.step = -1;      // overview
    const outs = R.legs.filter(campusLeg), bs = [...new Set(R.legs.filter(l => l.b).map(l => l.b))];
    if (outs.length || bs.length !== 1){ if (state.b) campusView(); const ends = [R.A, R.Z].map(ep => ep.kind === "room" ? [ep.r.B.c[0], ep.r.B.c[1], ep.r.B.h + 10] : [ep.nodes[0].p[0], ep.nodes[0].p[1], 5]);
      v = fitView(outs.flatMap(l => l.pts).concat(bs.map(id => [bById[id].c[0], bById[id].c[1]]), ends), 0); }
    else { const b = bById[bs[0]], lvs = [...new Set(R.legs.map(l => l.lv))];
      if (state.b !== b) enterBuilding(b);
      if (lvs.length === 1 && R.legs.every(l => l.type === "walk")){      // one building, one floor: open that floor and frame the route
        const li = lvs[0], pts = R.legs.flatMap(l => l.pts);
        const cx = pts.reduce((s, p) => s + p[0], 0)/pts.length, cy = pts.reduce((s, p) => s + p[1], 0)/pts.length;
        pts.push([cx-15, cy-15], [cx+15, cy+15]);                          // at least ~30 m of floor in view, so a short route keeps its surroundings
        state.level = li; v = fitView(pts, b.floors[li] + li*GAP); }
      else { state.level = "all"; v = viewBuilding(b, true); } } }
  else { const s = R.steps[i], li = s.leg === -1 ? 0 : s.leg === -2 ? R.legs.length-1 : s.leg; v = legView(R.legs[li]);
    if (s.leg < 0){ const ep = s.leg === -1 ? R.A : R.Z; if (ep.kind === "room") v = viewRoom(ep.r); } }
  flyTo(v); ui(); }
$("opendir").onclick = () => { openDir(); (DIR.from ? $("dto") : $("dfrom")).focus(); };
$("dirx").onclick = closeDir;
$("dswap").onclick = () => { const a = DIR.from; setEnd("from", DIR.to, true); setEnd("to", a); };
$("dsf").onchange = e => { DIR.sf = e.target.checked; recompute(); };
$("dprev").onclick = () => focusStep(Math.max(0, DIR.step - 1));
$("dnext").onclick = () => focusStep(Math.min(DIR.res.steps.length-1, DIR.step + 1));
$("dall").onclick = () => focusStep(-1);
document.querySelectorAll("#dir .clr").forEach(b => b.onclick = () => { setEnd(b.dataset.clr, null); $(b.dataset.clr === "from" ? "dfrom" : "dto").focus(); });
for (const [fid, which] of [["dfrom", "from"], ["dto", "to"]]){ const inp = $(fid);
  inp.addEventListener("focus", () => { DIR.field = which; inp.select(); });
  inp.addEventListener("input", () => { const t = inp.value.trim().toLowerCase(), box = $("dsug"); box.innerHTML = ""; DIR.field = which;
    if (!t){ box.hidden = true; return; }
    const hits = findHits(t).filter(h => endpoint(h.id)); box.hidden = false;
    if (!hits.length){ box.innerHTML = `<div class="res" style="cursor:default"><span class="s">No mapped place matches “${esc(inp.value)}”.</span></div>`; return; }
    for (const h of hits.slice(0, 30)){ const x = document.createElement("button"); x.className = "res";
      x.innerHTML = `<i class="dot" style="background:${h.c}"></i><span><div class="t">${esc(h.t)}</div><div class="s">${esc(h.s)}</div></span><span class="lv">${h.lv}</span>`;
      x.onclick = () => { setEnd(which, h.id); if (which === "from" && !DIR.to) $("dto").focus(); else if (which === "to" && !DIR.from) $("dfrom").focus(); }; box.append(x); } });
  inp.addEventListener("keydown", e => { if (e.key === "Enter"){ const f = $("dsug").querySelector("button.res"); if (f) f.click(); } if (e.key === "Escape") $("dsug").hidden = true; }); }
})();
